#Eureka server服务端口
server:
  port: 9200
spring:
  application:
    name: cloud-eureka # 应用名称，会在Eureka中作为服务的id标识（serviceId）
eureka:
  instance:
    prefer-ip-address: true #使用ip注册，否则会使用主机名注册了（此处考虑到对老版本的兼容，新版本经过实验都是ip）
  #自定义实例显示格式，加上版本号，便于多版本管理，注意是ip-address，早期版本是ipAddress
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}:@project.version@
 #   hostname: localhost
  client:
    service-url: # 客户端与EurekaServer交互的地址，如果是集群，也需要写其它Server的地址
      defaultZone:  http://localhost:9200/eureka/    #   http://${eureka.instance.hostname}:${server.port}/eureka/
    register-with-eureka: true     # 自己就是服务不需要注册自己
    fetch-registry: false     #自己就是服务不需要从Eureka Server获取服务信息,默认为true，置为false