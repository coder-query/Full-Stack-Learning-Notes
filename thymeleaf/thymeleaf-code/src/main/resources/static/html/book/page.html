<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>书籍分页列表</title>
    <!--
     响应视布局
     web + app + 小程序
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/ui/layui-v2.13.5/layui/css/layui.css"/>
    <script src="/ui/layui-v2.13.5/layui/js/layui.js"></script>
    <!-- Axios + 全局配置 -->
    <script src="/js/axios.min.js"></script>
    <script src="/js/config/axios-config.js"></script>
    <!-- API 接口 -->
    <script src="/js/api/book.js"></script>
</head>
<body>
    <div class="layui-fluid" style="margin-top: 100px; padding: 0 20px;">
        <table class="layui-hide" id="test" lay-filter="test"></table>
    </div>

</body>
<script>
    layui.use(['table', 'layer'], function() {
        var table = layui.table;
        // 创建渲染实例
        table.render({
            elem: '#test',
            // 自定义工具栏
            toolbar: `
                <div>
                    <button type="button" class="layui-btn layui-bg-blue lay-event='add'">
                        <i class="layui-icon layui-icon-add-1"></i> 新增
                    </button>
                    <button class="layui-btn layui-btn-primary layui-bg-red lay-event='batch-del'">
                        <i class="layui-icon layui-icon-close-fill"></i> 批量删除
                    </button>
                </div>
            `,
            loading: '<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop" style="color: #7aaff7"></i>',
            // 固定表格区域高度，内容超出内部滚动，分页位置不变
            height: 520,
            // 奇偶行背景色
            even: true,
            //
            cellMinWidth: 80,
            page: {
                /**
                 * count 数据总数区域
                 * prev 上一页区域
                 * page 分页区域
                 * next 下一页区
                 * limit 条目选项区域
                 * refresh 页面刷新区
                 * skip 快捷跳页区
                 */
                layout: ['prev', 'page', 'next', 'skip', 'count', 'limit', 'refresh'],
                first: '首页',
                last: '尾页',
                groups: 8,
                prev: '上一页',
                next: '下一页',
                limit: 30,
                limits: [1, 5, 10, 20, 30, 40, 50, 100, 200, 300, 400, 500],
                theme: '#31bdec'
            },
            method: 'post', // 请求方式
            url: 'http://127.0.0.1:8066/book/page', // 此处为静态模拟数据，实际使用时需换成真实接口
            contentType: 'application/x-www-form-urlencoded',
            request: {
                pageName: 'pageNo', // 页码的参数名称，默认：page
                limitName: 'pageSize' // 每页数据条数的参数名，默认：limit
            },
            parseData: function (res) { // res 即为原始返回的数据
                return {
                    "code": res.code === 200 ? 0 : res.code, // Layui 要求 0 表示成功
                    "msg": res.message, // 解析提示文本
                    "count": res.data.total, // 解析数据长度
                    "data": res.data.list // 解析数据列表
                };
            },
            cols: [[
                {
                    type: 'checkbox',
                    fixed: 'left',
                    width: 50
                },
                {
                    field: 'bookId',
                    title: '书籍id',
                    fixed: 'left',
                    width: 80
                },
                {
                    field: 'bookName',
                    title: '书籍名称',
                    fixed: 'left',
                    width: 160
                },
                {
                    field: 'authorName',
                    title: '作者',
                    width: 140
                },
                {
                    field: 'price',
                    title: '价格',
                    sort: true,
                    width: 80
                },
                {
                    field: 'categoryName',
                    title: '分类',
                    width: 100
                },
                {
                    field: 'createTime',
                    title: '创建时间',
                    sort: true,
                    width: 170
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookAddress',
                    title: '书籍地址',
                    width: 200
                },
                {
                    title: '操作',
                    width: 180,
                    fixed: 'right',
                    align: 'center',
                    templet: function (d) {
                        return '<div style="display:flex; gap:5px; justify-content:center; align-items:center">' +
                            '  <button type="button" class="layui-btn layui-btn-xs layui-bg-blue" lay-event="edit">' +
                            '    <i class="layui-icon layui-icon-edit"></i> 编辑' +
                            '  </button>' +
                            '  <button type="button" class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">' +
                            '    <i class="layui-icon layui-icon-delete"></i> 删除' +
                            '  </button>' +
                            '</div>';
                    }
                },
            ]],
            error: function (res, msg) {
                console.log(res, msg)
            }
        });

        // 单元格事件（编辑、删除按钮）
        table.on('tool(test)', function (obj) {
            var data = obj.data;
            let ops_event = obj.event;
            let layer = layui.layer;
            switch (ops_event) {
                case 'edit':
                    console.log(data)
                    layer.msg('编辑：' + data.bookName);
                    break;
                case 'del':
                    console.log(data)
                    layer.confirm('确定删除《' + data.bookName + '》吗？', {btn: ['确定', '取消']}, async function (index) {
                       const res = await BookApi.del(data.bookId)
                        if(res.code === 200){
                            layer.msg(res.data);
                            obj.del();
                            layer.close(index);
                            table.reload('test');
                        } else {
                            layer.msg(res.data || '删除失败');
                        }
                    });
                    break;
            }
        });

        // 工具栏事件
        table.on('toolbar(test)', function (obj) {
            let data = obj.data;
            let ops_event = obj.event;
            let layer = layui.layer;
            var options = obj.config; // 获取当前表格属性选项
            var checkStatus = table.checkStatus(options.id); // 获取选中行相关数据
            console.log(obj); // 查看对象所有成员
            switch (ops_event) {
                case 'add':
                    layer.msg('新增');
                    break;
                case 'batch-del':
                    layer.msg('批量删除');
                    break;
            }
        });
    });
</script>
</html>
