<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>书籍分页列表</title>
    <!--
     响应视布局
     web + app + 小程序
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../layui-v2.13.5/layui/css/layui.css"/>
    <script src="../../layui-v2.13.5/layui/layui.js"></script>
</head>
<body>
    <div class="layui-fluid" style="margin-top: 100px; padding: 0 20px;">
        <table class="layui-hide" id="test" lay-filter="test"></table>
    </div>

</body>
<script>
    layui.use(['table'], function() {
        var table = layui.table;
        // 创建渲染实例
        table.render({
            elem: '#test',
            toolbar: true, // 开启工具栏
            defaultToolbar: ['filter', 'exports', 'print'],
            // 固定表格区域高度，内容超出内部滚动，分页位置不变
            height: 520,
            even: true,
            cellMinWidth: 80,
            // lineStyle:'height: 60px;',
            page: {
                /**
                 * count 数据总数区域
                 * prev 上一页区域
                 * page 分页区域
                 * next 下一页区
                 * limit 条目选项区域
                 * refresh 页面刷新区
                 * skip 快捷跳页区
                 */
                layout: ['prev', 'page', 'next', 'skip', 'count', 'limit', 'refresh'],
                first: '首页',
                last: '尾页',
                groups: 8,
                prev: '上一页',
                next: '下一页',
                limit: 30,
                limits: [1, 5, 10, 20, 30, 40, 50, 100, 200, 300, 400, 500],
                theme: '#31bdec'
            },
            method: 'post', // 请求方式
            url: 'http://127.0.0.1:8066/book/page', // 此处为静态模拟数据，实际使用时需换成真实接口
            contentType: 'application/x-www-form-urlencoded',
            request: {
                pageName: 'pageNo', // 页码的参数名称，默认：page
                limitName: 'pageSize' // 每页数据条数的参数名，默认：limit
            },
            parseData: function (res) { // res 即为原始返回的数据
                return {
                    "code": res.code === 200 ? 0 : res.code, // Layui 要求 0 表示成功
                    "msg": res.message, // 解析提示文本
                    "count": res.data.total, // 解析数据长度
                    "data": res.data.list // 解析数据列表
                };
            },
            cols: [[
                {
                    type: 'checkbox',
                    fixed: 'left',
                    width: 50
                },
                {
                    field: 'bookId',
                    title: '书籍id',
                    fixed: 'left',
                    width: 80
                },
                {
                    field: 'bookName',
                    title: '书籍名称',
                    width: 160
                },
                {
                    field: 'authorName',
                    title: '作者',
                    width: 140
                },
                {
                    field: 'price',
                    title: '价格',
                    sort: true,
                    width: 80
                },
                {
                    field: 'categoryName',
                    title: '分类',
                    width: 100
                },
                {
                    field: 'createTime',
                    title: '创建时间',
                    sort: true,
                    width: 170
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookUrl',
                    title: '书籍链接',
                    width: 220
                },
                {
                    field: 'bookAddress',
                    title: '书籍地址',
                    width: 200
                },
                {
                    title: '操作',
                    width: 180,
                    fixed: 'right',
                    align: 'center',
                    templet: function (d) {
                        return '<div style="display:flex; gap:5px; justify-content:center;">' +
                            '  <button type="button" class="layui-btn layui-btn-sm layui-bg-blue" lay-event="edit">' +
                            '    <i class="layui-icon layui-icon-edit"></i> 编辑' +
                            '  </button>' +
                            '  <button type="button" class="layui-btn layui-btn-sm layui-btn-danger" lay-event="del">' +
                            '    <i class="layui-icon layui-icon-delete"></i> 删除' +
                            '  </button>' +
                            '</div>';
                    }
                },
            ]],
            error: function (res, msg) {
                console.log(res, msg)
            }
        });

        // 单元格事件（编辑、删除按钮）
        table.on('tool(test)', function (obj) {
            var data = obj.data;
            let ops_event = obj.event;
            let layer = layui.layer;
            switch (ops_event) {
                case 'edit':
                    console.log(data)
                    layer.msg('编辑：' + data.bookName);
                    break;
                case 'del':
                    console.log(data)
                    layer.confirm('确定删除《' + data.bookName + '》吗？', {btn: ['确定', '取消']}, function (index) {
                         /**
                             * 向后端发送删除请求，执行完毕后，可通过 reloadData 方法完成数据重载
                          */
                        // 拿到当前行数据的id
                        let id = data.bookId;
                        // ajax请求删除数据
                        let $ = layui.$;
                        $.ajax({
                            url: 'http://127.0.0.1:8066/book/del',
                            method: 'post',
                            data: {
                                id: id
                            },
                            contentType: 'application/x-www-form-urlencoded',
                            success: function (res) {
                               switch (res.code){
                                   case 200:
                                       console.log(res)
                                       layer.msg(res.data)
                                       // 删除对应行（tr）的 DOM 结构，并更新缓存
                                       obj.del();
                                       // 关闭提示框
                                       layer.close(index)
                                       // 刷新表格数据
                                       table.reload('test');
                                       break;
                                   case 500:
                                       console.log(res)
                                       layer.msg(res.data);
                                       break;
                               }
                            }
                        })
                    ;
                    });
                    break;
            }
        });

    });
</script>
</html>
