<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>分页组件</title>
    <link rel="stylesheet" href="/ui/layui-v2.13.5/layui/css/layui.css" />
    <script src="/ui/layui-v2.13.5/layui/js/layui.js"></script>
</head>
<body>
    <div class="layui-container">
        <div class="layui-row">
            <div class="layui-col-xs12">
                <div id="demo-laypage-all"></div>
            </div>
        </div>
    </div>
</body>

<script>
    layui.use(function(){
        let laypage = layui.laypage;
        // 完整显示
        laypage.render({
            elem: 'demo-laypage-all', // 元素 id
            count: 100, // 数据总数
            layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'], // 功能布局
            jump: function(obj){
                console.log(obj);
            }
        });
    });
</script>
</html>
