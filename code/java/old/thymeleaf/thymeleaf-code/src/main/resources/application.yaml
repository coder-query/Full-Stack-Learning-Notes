# tomcat 端口
server:
  port: 8066

spring:
  # 文件上传大小
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 路径匹配策略，适配swagger2
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher
  # 静态资源路径
  web:
    resources:
      static-locations: classpath:/META-INF/resources/, classpath:/resources/, classpath:/static/, classpath:/public/, classpath:/static/html
#  # Thymeleaf 配置
#  thymeleaf:
#    cache: false
#    prefix: classpath:/templates/
#    suffix: .html
#    encoding: UTF-8
#    mode: HTML
  # Jackson 配置
  Jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/book?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: 'root'
    password: '123456'
    druid:
      # 开启保活机制，防止连接长时间空闲被丢弃
      keep-alive: true
      # 空闲连接检测间隔（毫秒）
      time-between-eviction-runs-millis: 60000
      # 连接最小空闲时间（毫秒）
      min-evictable-idle-time-millis: 300000
      # 连接最大存活时间（毫秒）
      max-evictable-idle-time-millis: 900000
      # 验证连接是否有效的SQL
      validation-query: SELECT 1
      # 获取连接时检测有效性
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false


# mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

# Knife4j 配置
knife4j:
  enable: true
  basic:
    enable: false
    username: swagger
    password: swagger
