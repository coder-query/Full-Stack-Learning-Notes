spring:
    application:
        name: order-server
    profiles:
        active: dev
    cloud:
        nacos:
            discovery:
                server-addr: 127.0.0.1:8848
                namespace: public
                group: DEFAULT_GROUP
        openfeign:
            httpclient:
                enabled: false
            okhttp:
                enabled: true
# 日志配置
logging:
    level:
        com.shuai.feign: DEBUG
        # OkHttp 特定日志
        okhttp3: DEBUG
        com.squareup.okhttp3: DEBUG