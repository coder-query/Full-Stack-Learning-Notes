#spring.application.name=Boot_Redis_Template_Code
spring:
    application:
        name: Boot_Redis_Template_Code
    data:
        redis:
            host: 192.168.211.166
            database: 0
            port: 6379
            password: 123456
            timeout: 3000ms
            lettuce: # Lettuce客户端专属配置
                pool: # 连接池配置（可选，默认内置合理值）
                    max-active: 20   # 最大活跃连接数（推荐值：CPU核数 × 2，如8核设为16）
                    max-idle: 10     # 最大空闲连接数
                    min-idle: 2      # 最小空闲连接数
                    max-wait: -1ms   # 连接池耗尽时的最大等待时间（-1表示无限制）
server:
    port: 8025
