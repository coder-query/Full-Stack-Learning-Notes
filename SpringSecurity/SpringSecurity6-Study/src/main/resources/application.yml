mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false
  mapper-locations: classpath*:mapper/*.xml


# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mdk.springsecurity6study
# knife4j的增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

# JWT 配置
jwt:
  secret: mdk-spring-security-study-secret-key-2024-must-be-at-least-256-bits-long
  expiration: 86400000      # Access Token 有效期: 24小时 (毫秒)
  refresh-expiration: 604800000  # Refresh Token 有效期: 7天 (毫秒)


